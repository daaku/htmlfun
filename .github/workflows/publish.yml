name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Type of version bump'
        required: true
        default: 'minor'
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          cache-hash: ${{ hashFiles('**/deno.json') }}
      - name: deno bump-version
        run: |
          git config --global user.name 'Naitik Shah'
          git config --global user.email 'daaku@users.noreply.github.com'
          deno bump-version ${{ github.event.inputs.version }}
          git commit -am "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("./deno.json")).version)')"
          git tag "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("./deno.json")).version)')"
          git push --follow-tags
      - run: deno publish
